name: build

on:
  push:
      pull_request:
  workflow_dispatch:

jobs:
  dsp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP単体テスト(JUCE不要)
        run: |
          g++ -std=c++17 -O2 -o dsp_test test/offline_test.cpp
          ./dsp_test

  vst3:
    needs: dsp-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: JUCE を取得
        shell: bash
        run: git clone --depth 1 --branch 8.0.8 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --target NamiDJFX_VST3 --parallel
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJFX-Standard-${{ matrix.name }}
          path: build/NamiDJFX_artefacts/**/VST3/DJFX Standard.vst3

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: vst3
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: バージョン確認
        run: |
          echo "TAG=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV
          if gh release view "$(tr -d '[:space:]' < VERSION)" >/dev/null 2>&1; then echo SKIP=1 >> $GITHUB_ENV; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.SKIP != '1'
        uses: actions/download-artifact@v4
        with:
          path: art
      - name: ZIP
        if: env.SKIP != '1'
        run: |
          cd art
          for d in DJFX-Standard-*; do (cd "$d" && zip -r "../$d-${TAG}.zip" .); done
      - name: Release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" art/*.zip --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "DJFX Standard $TAG (beta)" --prerelease \
            --notes "現場でのDJ操作を、実機がなくてもDAW上でデモンストレーションできたらいいなと思って作りました。DJMのエフェクトとCDJのジョグ操作を再現するVST3です。

          - Windows: DJFX-Standard-windows-x64 の ZIP を展開し、DJFX Standard.vst3 を C:\\Program Files\\Common Files\\VST3 に置く
          - Mac: DJFX-Standard-macos-universal の ZIP を展開し、DJFX Standard.vst3 を /Library/Audio/Plug-Ins/VST3 に置く(未署名のため、初回は右クリックで開く、または xattr -dr com.apple.quarantine で許可が必要)
          - ベータ版です。DAWによって動きが違う可能性があります。不具合は Issues へ
          - 非公式の作品で、Pioneer DJ / AlphaTheta とは関係ありません
          - ライセンス: AGPL-3.0"
